<!DOCTYPE html>
<html lang="Pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Brasileiro</title>
</head>
<style>
    body {
        font: normal 20pt Arial;
        background-color: rgb(0, 148, 64);
        color: rgb(255, 203, 0);
        text-align: center;
    }
     div#res {
        margin-top: 20px;
        color: rgb(48, 38, 129);
    }
    input {
        margin-top: 30px;
        background-color: rgb(48, 38, 129);
        color: rgb(255, 203, 0);
    }
    button{
       margin-top: 20px;
       background-color: rgb(48, 38, 129);
       color: rgb(255, 203, 0); 
    }

    </style>
<body>
    <h1>Verificação de brasileridade</h1> 
    <img src="https://media0.giphy.com/media/v1.Y2lkPTZjMDliOTUyMXI3cnlxN2hvOHpmMWRhcTJpcjAxdGZqZXA5M3VhMG0xNmFra25ycSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/bIqdxoOVJ2oak/source.gif" alt="?"><br>
    <button onclick="darplay()">HINO NACIONAL</button><br>
    <p1>Digite seu país de origem e irei dizer se você é ou não um brasileiro</p1>
    <input type="text" name="pais" id="txtpais">
    <input type="button" value="Deixa eu verificar" onclick="verificação()">
    <div id="res"></div>
    <audio src="hino_nacional_brasileiro.mp3" id="som"></audio>
        
</body>
<script>
   
    function verificação() {
        var p = document.querySelector("input#txtpais")
        var res = document.querySelector("div#res")
        var pais = (p.value)
        let m = pais.toUpperCase()
        res.innerHTML = `<p1><strong>${m}</strong>??? Então você não é Brasileiro. </p1>`
        if (m == "BRASIL") {
            res.innerHTML = `Você é <strong>brasileiro</strong>!!!!!`
        }  
    }
    function darplay() {
        const audio = document.getElementById("som")
        audio.play() 
        audio.volume = 0.25

    }

</script>
</html>
