<!DOCTYPE html>
<html lang="Pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador Brasileiro</title>
    <link rel="icon" type="image/png" href="logo.png">
</head>
<style>
    body {
        font: normal 20pt Arial;
        background-color: rgb(0, 148, 64);
        color: rgb(255, 203, 0);
        text-align: center;
    }
     div#res {
        margin-top: 20px;
        color: rgb(48, 38, 129);
        margin-bottom: 20px;
    }
    input {
        margin-top: 30px;
        background-color: rgb(48, 38, 129);
        color: rgb(255, 203, 0);
    }
    button{
       margin-top: 20px;
       background-color: rgb(48, 38, 129);
       color: rgb(255, 203, 0);
       margin-bottom: 20px;
    }

    </style>
<body>
    <header>
        <h1>Verificação de Brasileridade</h1>
    </header> 
    <img src="bandeira do brasil ue.gif" id="bandeira" alt="bandeira"><br>
    <button onclick="darplay()">HINO NACIONAL</button><br>
    <p>Digite seu <strong>PAÍS</strong> de origem e irei dizer se você é ou não um brasileiro</p><br>
    <input type="text" name="pais" id="txtpais">
    <input type="button" value="Deixa eu verificar" onclick="verificação()">
    <div id="res"></div>
    <audio src="hino_nacional_brasileiro.mp3" id="som"></audio>
    <audio src="wtf-is-a-kilometer.mp3" id="sound"></audio>
    <audio src="musica_secreta.mp3" id="secret"></audio>
    <div id="evento" style="
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    justify-content: center;
    align-items: center;
    z-index: 9999;
">
    <img src="secreto.gif" style="width:100%; height:100%; object-fit:contain;">
</div>
        
</body>
<script>
   
    function verificação() {
       
        var p = document.querySelector("input#txtpais")
        var res = document.querySelector("div#res")
        var pais = (p.value)
        let m = pais.toUpperCase()
        const usa = document.getElementById("sound")
        const br = document.getElementById("som")
        usa.pause()
        usa.currentTime = 0
        
            const estados = [
        "ACRE",
        "ALAGOAS",
        "AMAPA",
        "AMAZONAS",
        "BAHIA",
        "CEARA",
        "DISTRITO FEDERAL",
        "ESPIRITO SANTO",
        "GOIAS",
        "MARANHAO",
        "MATO GROSSO",
        "MATO GROSSO DO SUL",
        "MINAS GERAIS",
        "PARA",
        "PARAIBA",
        "PARANA",
        "PERNAMBUCO",
        "PIAUI",
        "RIO DE JANEIRO",
        "RIO GRANDE DO NORTE",
        "RIO GRANDE DO SUL",
        "RONDONIA",
        "RORAIMA",
        "SANTA CATARINA",
        "SAO PAULO",
        "SERGIPE",
        "TOCANTINS"
    ]

    if (estados.includes(m)) {

        res.innerHTML = "Eu pedi pra digitar o PAÍS seu animal (to falando de vc dave)"
        return

    }


       switch (m) {
        case "BRASIL":
            res.innerHTML = `Você é <strong>brasileiro</strong>!!!!!`
            break
        case "BR":
            res.innerHTML = "AQUI É BRASIL POHA"
        case "BRAZIL":
            res.innerHTML = `Brasileiro de verdade não escreve com <strong>Z</strong>`
            break
        case "AMERICA":
            res.innerHTML = "unfortunately, america is not a country"
            break
        case "USA":
            res.innerHTML = "WHAT THE FUCK IS A KILOMETER🦅🦅🦅"
            const img = document.getElementById("bandeira") 
            img.src = "wtf-is-a-kilometer.gif"
            br.pause()
            usa.play()
            usa.volume = 1.0
            usa.onended = function() {
            img.src = "bandeira do brasil ue.gif"
            }   
            break
        case "UNITED STATES":
            res.innerHTML = "Quem no mundo americano escreveria assim?"
            break
        case "CHINA":
            res.innerHTML = "我非常喜欢鸡肉派"    
            break
        case "PORTUGAL":
            res.innerHTML = "devolva meu ouro"
            break
        case "VENEZUELA":
            res.innerHTML = "Cadê o maduro?"
            break
        case "ROBLOX": 
            res.innerHTML = "queremos injustiça com o celta"
            break
        case "A":
            res.innerHTML = "A de amor."
            break
        case "B":
            res.innerHTML = "B de beijinho."
            break
        case "C":
            res.innerHTML = "C de cala a boca pq eu não fiz com todas as letras."
            break
        case "D":
            res.innerHTML = "PARA"
            break
        case "E":
            res.innerHTML = "."
            break
        case "F":
            res.innerHTML = ".."
            break
        case "G":
            res.innerHTML = "..."
            break
        case "H": {
       
        const img = document.getElementById("bandeira")
        img.src = "H.png"
        setTimeout(() => {
        img.src = "bandeira do brasil ue.gif"
        }, 3000)
            break
    }
        case "PARAGUAY":
            res.innerHTML = "hi qami"
            break
         case "PARAGUAI":
            res.innerHTML = "hi qami"
            break    
        case "DUSTY":
            res.innerHTML = "eu"
            break
        case "2fort":
            res.innerHTML = "Madekoo sai da live"
            break
        case "JAPÃO":
            res.innerHTML = "Cadê o goku?"
            break
        case "PEDRA":
            res.innerHTML = "Papel"
            break
        case "PAPEL":
            res.innerHTML = "Tesoura"
            break
        case "TESOURA":
            res.innerHTML = "Pedra"
            break
        default:
            res.innerHTML = `<p1><strong>${m}</strong>??? Então você não é Brasileiro. </p1>`
            break
        
       }
       }
    
    function darplay() {

            const hino = document.getElementById("som")
            const secreto = document.getElementById("secret")


         const sorte = Math.random()

            hino.pause()
            secreto.pause()

            hino.currentTime = 0
            secreto.currentTime = 0


            if (sorte < 0.9) {
                document.title = "Verificador Brasileiro"
                hino.volume = 1.0
                hino.play()

            } else {
            
            document.title = "Ronaldinho Soccer 64"
            evento.style.display = "flex"
            res.innerHTML = "RONALDINHO SOCCER 64"
            secreto.play()

            secreto.onended = function() {
                document.title = "Verificador Brasileiro"
                evento.style.display = "none"

    }
}
    }

</script>
